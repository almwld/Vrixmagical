name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android host
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.virxmagical --project-name virxmagical .
          fi

      - name: Configure Android SDK levels
        run: |
          python - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 28")
              gradle.write_text(text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              text = text.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
              text = text.replace("</manifest>", '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>')
              manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Bundle pinned MediaPipe models
        run: dart run mediapipe_core:bundle_models

      - name: Format source
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Android debug APK
        run: flutter build apk --debug
