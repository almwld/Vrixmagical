name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap and configure Android host
        run: bash tool/bootstrap_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify native SplatKit dependency
        run: |
          cd android
          for attempt in 1 2 3; do
            if ./gradlew :app:dependencyInsight --dependency splatkit-android --configuration debugCompileClasspath | tee /tmp/splatkit-dependency.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          grep -F 'io.github.xget7:splatkit-android:0.1.0-beta.3' /tmp/splatkit-dependency.txt

      - name: Bundle pinned MediaPipe models
        run: dart run mediapipe_core:bundle_models

      - name: Format source
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
