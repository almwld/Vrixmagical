name: flutter_reality
description: VRIX-maintained Android ARCore plugin fork with synchronized RGB-D capture.
version: 0.1.0-vrix.1
publish_to: none
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"
dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  vector_math: ^2.1.1
  json_annotation: ^4.9.0
  geolocator: ^12.0.0
  meta: ^1.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2
flutter:
  plugin:
    platforms:
      android:
        package: com.flutterreality.flutter_reality
        pluginClass: ArFlutterPlugin
