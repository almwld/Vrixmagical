name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Native XPBD solver regression
        run: |
          cmake -S packages/vrix_soft_body/android/src/main/cpp -B /tmp/vrix-soft-body-native \
            -DVRIX_SOFT_BODY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/vrix-soft-body-native --parallel 2
          ctest --test-dir /tmp/vrix-soft-body-native --output-on-failure

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap and configure Android host
        run: bash tool/bootstrap_android.sh

      - name: Verify SVG-derived Android launcher icons
        run: python3 tool/generate_launcher_icons.py --verify

      - name: Install dependencies
        run: flutter pub get

      - name: Verify local XPBD plugin resolution
        run: |
          python - <<'PY'
          import json
          with open(".dart_tool/package_config.json", encoding="utf-8") as stream:
              packages = json.load(stream)["packages"]
          plugin = next((item for item in packages if item["name"] == "vrix_soft_body"), None)
          assert plugin is not None, "vrix_soft_body path plugin was not resolved"
          print("Resolved vrix_soft_body:", plugin["rootUri"])
          PY
          test -s packages/vrix_soft_body/android/src/main/cpp/CMakeLists.txt
          test -s packages/vrix_soft_body/android/src/main/cpp/vrix_soft_body.cpp

      - name: Bundle pinned MediaPipe models
        run: dart run mediapipe_core:bundle_models

      - name: Format source
        run: dart format lib test packages/vrix_soft_body/lib

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/vrix_soft_body/lib

      - name: Analyze app and native plugin Dart API
        run: |
          flutter analyze --no-fatal-infos
          dart analyze packages/vrix_soft_body

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify native libraries in debug APK
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/debug-apk-files.txt
          grep -Ei '^lib/arm64-v8a/[^/]*jolt[^/]*\.so$' /tmp/debug-apk-files.txt
          grep -F 'lib/arm64-v8a/libvrix_soft_body.so' /tmp/debug-apk-files.txt

      - name: Android release APK
        run: flutter build apk --release

      - name: Verify native libraries in release APK
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-release.apk | tee /tmp/release-apk-files.txt
          grep -Ei '^lib/arm64-v8a/[^/]*jolt[^/]*\.so$' /tmp/release-apk-files.txt
          grep -F 'lib/arm64-v8a/libvrix_soft_body.so' /tmp/release-apk-files.txt

      - name: Android split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify split APK outputs, signatures and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            "$APKSIGNER" verify --verbose "$apk"
            contents="$(unzip -Z1 "$apk")"
            grep -F "lib/$abi/" <<<"$contents"
            grep -Ei "^lib/$abi/[^/]*jolt[^/]*\.so$" <<<"$contents"
            grep -F "lib/$abi/libvrix_soft_body.so" <<<"$contents"
            echo "Verified signed APK and native physics libraries for $abi: $(stat -c%s "$apk") bytes"
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Android release App Bundle
        run: flutter build appbundle --release

      - name: Verify native libraries in release bundle
        run: |
          unzip -Z1 build/app/outputs/bundle/release/app-release.aab | tee /tmp/release-aab-files.txt
          grep -Ei '^base/lib/arm64-v8a/[^/]*jolt[^/]*\.so$' /tmp/release-aab-files.txt
          grep -F 'base/lib/arm64-v8a/libvrix_soft_body.so' /tmp/release-aab-files.txt

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-universal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: virxmagical-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
